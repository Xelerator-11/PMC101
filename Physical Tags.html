<!DOCTYPE HTML>
<html>
<head>
    <title>Physical Tags</title>
</head>
<body>
    <h1>Example of Physcial Tags</h1>
    <p>This is a <b>Bold</b> text</p>
    <P>This is a <i>Italic</i> text</P>
    <p>This is a <u>Underlined</u> text</p>
    <p>This is a <big>Big</big> text amd this is a <small>Small</small> Text</P>
    <p>Chemical Formula: H<sub>2</sub>O</p>
    <p>Mathematics: 5<sup>2</sup> = 25</p>
    <p>This is <strike>Strike through</strike> text</p>
    <P>This is <tt>Monospaced/Teletype</tt> text</P>
</body>
</html>
