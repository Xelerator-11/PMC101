<!DOCTYPE html>   <!-- The <!Doctype html> declaration defines 
                       that this document is an HTML5 document-->
<html>            <!-- The <html> element is the root element of an 
                        HTML page-->
    <head>        <!-- THe <head> element contains meta information 
                    about HTML page-->
        <title>Page Title</title>  <!-- The <title> element specifies a
                                        title for the HTML page (which is shown in the
                                        browser titl =e bar or in the page tab) -->
    </head>
    <body>        <!-- The <body> element =defines the documents body and is a container
                       for all the visile contents such as a container for al the visible
                       contents such as heading, paragraphs, images, hyperlinks, tables,
                       etc.-->
        <h1>My First Heading</h1>   <!-- THe <h1> element defines a large heading-->
    </body>
</html>
