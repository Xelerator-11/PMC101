<!DOCTYPE html>
<html>
    <head>
        <title>Unordered List</title>
    </head>
    <body>
        <h1>Example of unordered list in default</h1>
        <ul>
            <li>Milk</li>
            <li>Bread</li>
            <li>Eggs</li>
            <li>Oil</li>
        </ul>
        <h2>Unordered List Example</h2>
        <h3>1. Circle</h3>
        <ul style = "list-style : circle;">
            <li>Milk</li>
            <li>Bread</li>
            <li>Eggs</li>
            <li>Oil</li>
        </ul>      
        <h3>2. Disc</h3>
        <ul style = "list-style : disc;">
            <li>Milk</li>
            <li>Bread</li>
            <li>Eggs</li>
            <li>Oil</li>
        </ul>
        <h3>3. Square</h3>
        <ul style = "list-style : square;">
            <li>Milk</li>
            <li>Bread</li>
            <li>Eggs</li>
            <li>Oil</li>
        </ul>
        <h3>4. None</h3>
        <ul style = "list-style : none">
            <li>Milk</li>
            <li>Bread</li>
            <li>Eggs</li>
            <li>Oil</li>
        </ul>
    </body>
</html>
